name: Release
# Run this from the Actions tab when the work on the dev branch is ready for users.
# It runs the checks, moves main up to dev, tags the version, and publishes a GitHub Release
# with a clean ZIP of the user-facing files. Use "dry run" to try it without publishing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, like 1.1.0"
        required: true
      notes:
        description: "What changed (optional; shown on the release page)"
        required: false
        default: ""
      dry_run:
        description: "Dry run: check and build the ZIP only, publish nothing"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Check the version number
        run: |
          echo "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Version must look like 1.2.3"; exit 1; }
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then echo "v${{ inputs.version }} already exists"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run all checks
        run: |
          pip install openpyxl==3.1.5
          ./tests/run_tests.sh
      - name: Build the user ZIP
        run: |
          name="landing-kit-${{ inputs.version }}"
          mkdir -p "dist/$name"
          cp -r README.md sop claude tools templates examples extras "dist/$name/"
          [ -d eval ] && mkdir -p "dist/$name/eval" && cp eval/README.md eval/results.md "dist/$name/eval/" 2>/dev/null || true
          (cd dist && zip -qr "$name.zip" "$name")
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: landing-kit-${{ inputs.version }}
          path: dist/*.zip
      - name: Publish (skipped on dry run)
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git merge --ff-only origin/dev || { echo "main has commits that dev doesn't. Merge main into dev first."; exit 1; }
          git push origin main
          git tag -a "v${{ inputs.version }}" -m "Landing Kit ${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
          notes="$NOTES"
          [ -z "$notes" ] && notes="Landing Kit ${{ inputs.version }}. Download the ZIP below and follow sop/01-set-up.md."
          gh release create "v${{ inputs.version }}" "dist/landing-kit-${{ inputs.version }}.zip" \
            --title "Landing Kit ${{ inputs.version }}" --notes "$notes"
